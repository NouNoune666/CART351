{% extends "base.html" %}

{% block content %}

<div class="formContainer">
    <form id="insertInfo" action="{{url_for('getSearchCriteria_adv')}}">
        <fieldset>
            <p>
                <label> NASA API search criteria: </label>
                <input type="text" size="24" maxlength="40" value="search for..." name="search_criteria_adv" required>
            </p>

            <p>
                <input type="submit" value="submit" />
            </p>
        </fieldset>

    </form>
</div>

<div class="imagesAdv">
    {% if images %}
    {% for eachImage in images %}

    <img src="{{eachImage}}" />

    {% endfor %}
    {% endif %}
</div>


{% endblock %}
