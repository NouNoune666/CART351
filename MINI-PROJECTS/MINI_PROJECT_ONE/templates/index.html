<!-- will be a child of base-->
{% extends "base.html" %}

{% block scriptblock %}
<!-- Import Maps -->
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
    }
}
</script>
<!-- link to main script-->
<script type="module" src="{{url_for('static',filename='js/script.js')}}"></script>
{% endblock %}

{% block content %}

<!-- Intro overlay -->
        <div id="intro-overlay">
            <h1>CATCLAIM</h1>
            <p class="subtitle"> Place a cat on a facade and claim it. </p>

            <div class="controls-grid">
                <span class="key">W A S D</span>
                <span class="desc">Move around</span>

                <span class="key">Mouse</span>
                <span class="desc">Look around</span>

                <span class="key">Space</span>
                <span class="desc">Fly up</span>

                <span class="key">C</span>
                <span class="desc">Fly down</span>

                <span class="key">Esc</span>
                <span class="desc">Lock / unlock mouse pointer</span>
            </div>

            <button class="start-btn" id="start-btn">START</button>
            <p class="note">Press Esc at any time to unlock the pointer</p>
        </div>

<form id="insertImageForm" method="post" enctype="multipart/form-data">
    <p>
        <label for="uploadFile">Upload a cat:</label>
        <input id="uploadFile" type="file" name='the_file' size=10 required id=buttons />
    </p>
    <p>
        <label></label>
        <input id="submitImage" type="submit" name="submit" value="submit this cat" id=buttons />
    </p>


</form>

<div id="results">
    <h4>RESULTS</h4>
    <div id="result-container">
    </div>
</div>

{% endblock %}
