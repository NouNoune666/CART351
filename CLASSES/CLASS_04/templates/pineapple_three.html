<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pineapples again in flask and vars</title>
</head>

<body>
    <h1>pineapples again in flask number three</h1>
    <h2>Hello {{my_variable}}</h2>
    <h2>hello list {{my_list[-1]}}</h2>
    <h3>hello dictionnary {{my_dict["color"]}}</h3>
    <ul>
        <!-- JINJA syntax for loop -->
        {% for item in my_list %}
        <!-- output the item-->
        <li style="color:purple">item:{{item}}</li>
        <!-- close the for loop-->
        {% endfor %}
    </ul>
    <img src="../static/images/pineapple.jpeg" />

</body>

</html>
